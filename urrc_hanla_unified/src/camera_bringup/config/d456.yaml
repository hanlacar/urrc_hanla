/camera/camera:
  ros__parameters:
    serial_no: "338122302896"
    enable_infra1: false
    enable_infra2: false
    enable_color: true
    rgb_camera.color_profile: "640x480x60"
    rgb_camera.color_format: "RGB8"
    rgb_camera.enable_auto_exposure: true
    color_qos: "SENSOR_DATA"
    # Color gain remains automatic under auto exposure. Wrapper 4.58.1 has no
    # separate rgb_camera.enable_auto_gain launch parameter.
    # 정지선 거리는 aligned Depth만 사용한다.
    enable_depth: true
    depth_module.depth_profile: "640x480x15"
    depth_qos: "SENSOR_DATA"
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: true
    gyro_fps: 200
    gyro_qos: "SENSOR_DATA"
    enable_accel: true
    accel_fps: 100
    accel_qos: "SENSOR_DATA"
    enable_motion: false
    unite_imu_method: 0
    pointcloud.enable: false
    align_depth.enable: true
    enable_sync: true
    enable_rgbd: false
    publish_tf: false
    # The vehicle USB hub can enumerate before the D456 appears. Keep waiting
    # instead of terminating the integrated launch, then retry quickly if the
    # camera is unplugged and reconnected.
    wait_for_device_timeout: -1.0
    reconnect_timeout: 2.0
