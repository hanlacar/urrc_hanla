front_lidar_detector:
  ros__parameters:
    scan_topic: /front/scan
    min_range_m: 0.12
    max_range_m: 12.0
    # Rectangle in the front LaserScan frame (+x forward, +y left).
    roi_x_min_m: 0.12
    roi_x_max_m: 12.0
    roi_half_width_m: 0.975
    # Front sensor is at the bumper; this rejects any returns behind it.
    self_x_min_m: -1.0
    self_x_max_m: 0.10
    self_y_half_width_m: 0.45
    cluster_distance_m: 0.18
    min_cluster_points: 3
    scan_timeout_s: 0.5
    marker_lifetime_s: 0.25
