# t870_mcu.yaml
#
# ★ 내부 토픽 이름을 /mcu/cmd_* 로 바꿨다.
#   이유: GPS팀이 /mcu_drive, /mcu_wheel 을 자기 출력으로 쓰고 있어서
#   그대로 두면 GPS 명령이 중재기를 건너뛰고 브릿지로 직행한다.
#   (같은 토픽에 발행자 둘 → 중재 무력화 + 명령 충돌)
#
#   manager  →  /mcu/cmd_drive, /mcu/cmd_wheel, /mcu/cmd_stop  →  bridge
#   GPS팀    →  /mcu_drive, /mcu_wheel  →  manager 의 입력 중 하나로 취급

# ============================================================
# 시리얼 브릿지
# ============================================================
mcu_bridge:
  ros__parameters:
    # "auto" = 아두이노를 스스로 찾는다 (권장. 팀원 PC 마다 번호가 다르다).
    #   탐색 순서: port_symlinks → /dev/serial/by-id 장치 이름
    #   특정 포트를 강제하려면 "/dev/ttyACM1" 처럼 경로를 직접 쓴다.
    port: "auto"

    # setup.sh 가 udev 로 만들어주는 고정 이름. 벤더 ID 기준이라
    # 어느 컴퓨터에서 클론해도 동일하게 잡힌다.
    port_symlinks: ["/dev/t870_mcu"]

    # 자동 탐색 실패 시 시도할 포트. 비워두는 것이 안전하다.
    # ★ 예전에는 /dev/ttyACM0 을 무작정 열었다. 거기 GPS 가 앉아 있으면
    #   GPS 포트로 구동 명령을 쏘게 된다. 실제로 반나절을 날린 적이 있다.
    fallback_port: ""

    baud: 115200

    # 중재기 출력을 구독한다. 팀 토픽을 직접 구독하지 않는다.
    input_drive_topic: "/mcu/cmd_drive"
    input_wheel_topic: "/mcu/cmd_wheel"
    input_stop_topic: "/mcu/cmd_stop"
    estop_topic: "/estop_lock"
    reset_estop_service: "/mcu/reset_estop"

    send_hz: 10.0
    drive_timeout_s: 0.5
    wheel_timeout_s: 0.5
    status_poll_hz: 5.0

    max_steer_deg: 27.0
    steer_limit_ms: 440
    steer_cmd_mode: "W"
    wheel_timeout_policy: "hold_last"

    # ---------- 직진 보정 ----------
    # 차가 한쪽으로 흘러갈 때 모든 조향 명령에 더하는 고정 각도. +우 / -좌
    # 오른쪽으로 흘러가면 음수, 왼쪽으로 흘러가면 양수를 넣는다.
    #
    # 구하는 법: 조향 중앙으로 직진 d[m] 주행 후 횡오차 y[m] 측정
    #     보정각[도] = -degrees( 2 * y * 0.73 / d^2 )
    #   예) 5m 에 오른쪽으로 0.20m 치우침 -> -1.3도
    #
    # 원인이 조향 영점이든 뒷축 틀어짐이든 같은 방식으로 보정된다.
    steer_offset_deg: 0.0

    # ---------- 급정거 ----------
    #
    # ★ 2026-08-28 수정. 그 전까지 "1.00"(감속 램프 정지)이 들어 있었다.
    #   v29 부터 램프를 건너뛰는 제동 명령 B 가 있는데 쓰지 않고 있었다.
    #   → 라이다가 estop 을 걸어도 실제로는 0.5초짜리 램프가 나갔다.
    #
    # ⚠ B 를 매 주기 반복 전송하면 안 된다. 펌웨어가 제동 펄스 타이머를
    #   매번 다시 찍어 역토크가 유지되고 차가 뒤로 간다.
    #   브릿지가 "상승 에지 1회 + 이후 hold 반복"으로 처리한다.
    estop_serial_command: "B"       # 급정거 순간 1회
    estop_hold_command: "1.00"      # 이후 정지 유지 + 워치독 급식
    estop_repeat_s: 0.5             # 제동 재시도 간격. 0=재시도 없음
                                    # 펌웨어 BRAKE_MAX_MS(0.30s)보다 커야 함
                                    # ⚠ 더 좁히지 말 것 — 제동 방향이 "마지막
                                    #   명령 방향" 기준이라, 멈춘 뒤 뒤로 밀리면
                                    #   다음 펄스가 후진을 가속한다
    stop_timeout_s: 0.5

    # ★ 0830 변경: true → false
    #
    #   true 면 브릿지가 연결될 때마다 W0(조향 중앙)을 1회 보낸다.
    #   즉 **켤 때마다 바퀴가 저 혼자 중앙으로 움직인다.**
    #
    #   문제: 여기서 말하는 "중앙"은 steerNetMs = 0 자리다.
    #   그건 마지막으로 M 을 친 위치일 뿐 진짜 직진 방향이 아니다.
    #   영점이 틀어져 있으면 켤 때마다 엉뚱한 데로 바퀴를 돌린다.
    #   측정 중이거나 차를 세워둔 상태에서 이러면 위험하고 성가시다.
    #
    #   false 면 연결 시 STOP 만 보내고 조향은 **있던 자리 그대로** 둔다.
    #   중앙이 필요하면 사람이 C 를 치거나 조종 화면에서 C 를 누른다.
    #
    #   ⚠ 조향각 폐루프(AS5600 등)를 붙여 절대 각도를 알게 되면
    #     그때는 다시 켜는 것을 검토할 것. 지금은 각도를 못 믿는다.
    center_steer_on_connect: false
    arduino_reset_wait_s: 2.0
    reconnect_delay_s: 1.0
    telemetry_timeout_s: 2.0
    latch_on_firmware_fault: true

    # /estop_lock 의 true 를 "살아있는 주장" 으로 볼 유효시간 [초].
    # ★ 없으면 복구 불가 상태가 생긴다 — true 를 한 번 쏘고 죽은 노드 때문에
    #   래치 해제가 영구히 거부된다. 래치 자체는 그대로고, 해제 허용 여부만 본다.
    estop_assert_timeout_s: 1.0
    coasting_policy: "last_direction"

    # ---------- 발행 토픽 ----------
    # 전부 /mcu/ 네임스페이스 아래로 모았다.
    # 다른 팀이 쓰던 /rpm, /steer_angle, /vehicle/* 같은 최상위 이름과
    # 절대 겹치지 않아 발행자 충돌이 생기지 않는다.
    # (/odom 만 예외 — Nav2 표준 이름이라 그대로 둔다)
    pub_topic_encoder: "/mcu/encoder"              # 엔코더 누적 카운트 (Int32)
    pub_topic_steer_angle: "/mcu/steer_deg"      # 조향각 추정 [도] (Float32)
    pub_topic_rpm: "/mcu/rpm"
    pub_topic_steer_a0: "/mcu/steer_a0"
    pub_topic_steer_ms: "/mcu/steer_ms"
    pub_topic_speed_mps: "/mcu/speed_mps"
    pub_topic_speed_kph: "/mcu/speed_kph"
    pub_topic_distance: "/mcu/distance_m"
    pub_topic_speed_valid: "/mcu/speed_valid"
    pub_topic_connected: "/mcu/connected"
    pub_topic_status: "/mcu/fw_state"
    pub_topic_raw_status: "/mcu/raw_status"
    # STATUS 가 아닌 펌웨어 출력 (MCU_BOOT / BRAKE_OK / BRAKE_DONE / CAL_* ...)
    # ★ 예전에는 전부 버려서, ROS 로 띄우면 제동 결과를 볼 방법이 없었다.
    pub_topic_fw_message: "/mcu/fw_message"
    pub_topic_feedback_valid: "/mcu/telemetry_ok"
    pub_topic_fault: "/mcu/fault"
    pub_topic_fault_text: "/mcu/fault_text"
    pub_topic_ready: "/mcu/ready"
    pub_topic_iface_status: "/mcu/iface_state"
    pub_topic_estop: "/mcu/estop_latched"
    pub_topic_hard_stop: "/mcu/hard_stop_active"
    # ★ 0829 변경: "/odom" → "/mcu/odom"
    #   팀원의 mission_manager/wheel_odom 노드가 같은 "/odom" 을 발행한다.
    #   퍼블리셔가 둘이면 메시지가 번갈아 들어와 위치가 튄다.
    #   그쪽은 IMU yaw(/imu/relative_yaw_deg)를 쓰고 우리는 조향각 추정을
    #   쓰는데, 우리 조향각은 아직 못 믿는다(포텐셔미터 가동범위 문제).
    #   → /odom 의 주인은 wheel_odom 으로 넘기고 우리 것은 참고용으로 뺀다.
    pub_topic_odom: "/mcu/odom"

    # 구버전 이름(/drive, /wheel, /arduino/telemetry_ok)도 같이 발행할지.
    # 최상위 이름이라 다른 팀과 충돌할 수 있다. 기본 false 유지.
    publish_legacy_names: false

    # ★ 2026-08-29 재측정 — 아두이노 단독 스케치 (ROS 없이)
    #     955 카운트 / 4.78 m (2단, 10초, 하중 실린 상태)
    #     내부 검증: 평균속도 0.455 m/s (2단 문서값 0.526 과 정합)
    #                정속구간 99.6 카운트/s ÷ 0.5 m/s = 199  (총합과 일치)
    #
    #   1카운트 = 5.01mm,  바퀴 1회전 = 163카운트 (둘레 0.817m 가정)
    #
    #   이전 값 533.1 은 틀렸다. odom 이 실제의 37.5% 만 보고했다
    #   (실제 10m → odom 3.75m).
    #
    # ==========================================================
    # 🔴🔴 0830 현장 확인 — 이 값으로 나온 거리를 위치로 쓰지 말 것
    # ==========================================================
    #   199.8 은 "바퀴가 한 바퀴 돌면 몇 m 인가" 로는 맞는 값이다.
    #   ENCODER_CPR 163 ÷ 바퀴둘레 0.817m = 199.5 와도 일치한다.
    #
    #   문제는 **구동륜이 헛돈다**는 것이다. 0830 실측:
    #
    #     1단 15초 · 같은 명령 3회
    #       거리 1.73 m / 2052 카운트   → 슬립 83%
    #       거리 4.98 m / 2543 카운트   → 슬립 61%
    #       거리 6.32 m / 2917 카운트   → 슬립 57%
    #
    #     같은 명령 15초인데 간 거리가 3.6배 달랐다.
    #
    #   즉 카운트 → 거리 환산에 **어떤 상수를 넣어도 맞지 않는다.**
    #   슬립이 회차마다 달라지기 때문이다.
    #
    #   검증한 것 (0830)
    #     · 엔코더 눈금은 정확  — 1단 회귀 기울기 181.7 ≈ 스펙 199.5
    #     · 전기 노이즈 아님    — 바퀴를 막으니 2초에 23카운트뿐
    #     · 원인은 구동륜 슬립 하나
    #
    #   ▶ 쓰는 법
    #     · /mcu/encoder      원시 카운트. 바퀴 회전량으로는 믿어도 된다
    #     · /mcu/distance_m   "바퀴가 굴러간 거리". 지면 이동거리가 아니다
    #     · 위치 추정은 GPS/IMU 로 할 것. wheel_odom 거리는 못 믿는다
    #
    #   ▶ 근본 해결
    #     구동하지 않는 바퀴(앞바퀴)에 엔코더를 달면 슬립이 없어진다.
    #     펌웨어에 자리가 이미 있다 — D18/D19, 내부 풀업까지 설정됨.
    counts_per_meter: 199.8
    wheelbase_m: 0.73
    encoder_signed: false

    # 🔴 0829 추가 — "달리다 멈추면 엔코더가 초기화된다" 대책
    #
    #   제동은 역토크 펄스라 전기 노이즈가 가장 큰 순간이다.
    #   그때 시리얼이 깨지면 STATUS 필드가 밀리거나 문자가 섞인다.
    #   예전에는 못 읽은 필드를 0 으로 채워 발행했고, 누적 카운터에
    #   0 이 튀니 구독자에게는 "멈출 때마다 초기화" 로 보였다.
    #
    #   이제 못 읽거나 물리적으로 불가능한 점프는 발행하지 않고
    #   직전 값을 유지한다. 아래는 그 "불가능" 기준 [카운트/초].
    #   199.8 counts/m 기준 2000 = 10 m/s. 이 차 최고속(약 0.8m/s)의 12배라
    #   정상 주행은 절대 안 걸리고 깨진 값만 걸러진다.
    #   0 으로 두면 점프 검사를 끈다 (파싱 실패는 그래도 걸러진다).
    encoder_max_counts_per_s: 2000.0
    odom_frame: "odom"
    base_frame: "base_link"

    # TF(odom -> base_link)를 이 노드가 발행할지.
    # ★ GPS팀이나 다른 노드가 같은 TF 를 발행하면 충돌한다.
    #   TF 트리에 같은 부모-자식 링크를 두 곳에서 쏘면 값이 번갈아 튄다.
    #   융합 노드(robot_localization 등)를 쓸 계획이면 여기를 false 로 두고
    #   그쪽이 TF 를 담당하게 해야 한다.
    #
    # ★ 0829 변경: true → false
    #   wheel_odom 노드가 publish_tf=True 로 odom→base_footprint 를 쏘고
    #   있다. 우리가 odom→base_link 를 같이 쏘면 odom 밑에 자식이 둘이
    #   생겨 TF 트리가 깨진다. TF 주인을 wheel_odom 하나로 정리한다.
    #
    #   ⚠ 대신 base_footprint→base_link 를 누군가 반드시 발행해야 한다.
    #     (URDF 또는 static_transform_publisher). 아무도 안 쏘면 Nav2 가
    #     base_link 를 못 찾는다.
    publish_tf: false

    # ---------- 오도메트리 신뢰도 (공분산) ----------
    #
    # ★ 0828 추가. 그 전에는 covariance 가 전부 0 이었다.
    #   0 은 "오차가 없다"는 뜻이라, EKF 로 융합하면 필터가 이 값을 절대
    #   신뢰하고 GPS 를 무시한다. 우리 heading 은 조향각을 시간으로 추측한
    #   값이라 가장 못 믿을 값인데 그걸 완벽하다고 선언하고 있었다.
    #
    # ⚠ 아래는 잠정값이다. 실측 후 조정할 것.
    #   dist 0.15 는 counts_per_meter 실측 편차 15.2% 에서 왔다.
    #   yaw 쪽은 조향각을 측정하지 못해 근거 없는 보수적 추정이다.
    #
    # 이 값으로 나오는 대략적인 불확실도:
    #   직진 5m   위치 1σ 0.08m,  방위 1σ 0.29도
    #   직진 20m  위치 1σ 0.25m,  방위 1σ 0.57도
    #   90도 선회 1회  방위 1σ 6.9도,  위치 1σ 0.28m
    odom_dist_error_ratio: 0.15     # 이동 1m 당 위치 오차 비율
    odom_yaw_error_ratio: 0.5       # 회전 1rad 당 방위 오차 비율
    odom_yaw_drift_per_m: 0.010     # 직진 1m 당 방위 드리프트 [rad]
    odom_max_pos_var: 25.0          # 위치 분산 상한 [m^2] (=5m)
    odom_max_yaw_var: 1.0           # 방위 분산 상한 [rad^2] (=1rad)
    odom_vel_error_ratio: 0.15
    odom_vel_error_floor: 0.02      # [m/s]

    # 엔코더가 앞축(조향축)에 있어 선회 시 뒤축보다 더 돈다.
    # d_rear = d_front x cos(조향각) 으로 환산할지.
    #
    # ★ 조향각은 측정값이 아니라 시간 기반 추정이다.
    #   직진 중인데 steer_ms 가 440(27도)로 남아 있으면 cos(27도)=0.891,
    #   즉 거리가 11% 짧게 나온다.
    #   거리가 실제와 안 맞으면 false 로 두고 다시 재볼 것.
    #   AS5600 으로 실제 각도를 재게 되면 true 가 정답이다.
    odom_steer_compensation: true

    # 오도메트리 원점 재설정 서비스
    #   ros2 service call /mcu/reset_odom std_srvs/srv/Trigger '{}'
    reset_odom_service: "/mcu/reset_odom"


# ============================================================
# 명령 중재기
# ============================================================
mcu_manager:
  ros__parameters:
    source_names: [lidar, camera, gps, manual]

    # 구동: 고정 우선순위 (앞이 이김)
    drive_priority: [lidar, camera, gps]

    # ========================================================
    # 대회 구간 모드 — 2026-08-29 GPS팀 이름으로 통일
    #
    # ★ 이름의 출처는 GPS팀 경로 CSV 의 mode 열이다.
    #   (mmission_ws/routes/**.csv — 실제 값을 전수 확인해서 맞췄다)
    #   그쪽 gps_route_follower 가 그 값을 그대로 문자열로 발행하므로,
    #   우리가 그 이름을 그대로 받는 것이 어긋날 여지가 가장 적다.
    #
    #   0828 까지 쓰던 우리 이름 → GPS팀 이름
    #     INTERSECTION_1/2/3  →  INTERSECTION   (교차로를 번호로 안 나눈다)
    #     CRANK               →  D_COURSE       (직각·굴절 코스)
    #     ACCELERATION        →  ACCEL
    #     START / FINISH      →  (없음. GPS CSV 에 그런 값이 없다)
    #     SUDDEN_STOP         →  (없음. /<팀>_stop 으로 이미 처리된다)
    #
    #   IDLE 만 우리 것을 남긴다 — initial_mode 기본값이라 반드시 필요하다.
    #
    # ⚠ 이름이 또 바뀌면 여기와 wheel_owner_overrides 두 곳만 고친다.
    #   코드 수정은 필요 없다.
    #
    # GPS팀 CSV 에서 확인된 실제 사용량
    #   NORMAL 2154 / INTERSECTION 1729 / T_PARK 920 / D_COURSE 884
    #   PARALLEL_PARK 839 / ACCEL 821 / S_COURSE 568 / SLOPE 109
    # ========================================================
    # ==========================================================
    # 🔴🔴 0831 — 구간 이름을 버리고 "경로 순번" 을 모드로 쓴다
    # ==========================================================
    #   왜 바꾸나
    #     카메라는 구간마다 쓰는 로직이 전부 다르다. 그런데 이름 방식에서는
    #     같은 "NORMAL" 이 경로에 여러 번 나온다. 카메라가 받는 값이 그냥
    #     "NORMAL" 이라 **몇 번째인지 알 수가 없다.**
    #     번호로 주면 그 자체가 구간 식별자가 되어 그 문제가 사라진다.
    #
    #   경로 11구간 (팀 확정, 0831)
    #
    #      0  대기 (출발 전)
    #      1  출발 직선
    #      2  경사로
    #      3  D 코스 (직각·굴절)
    #      4  교차로
    #      5  S 코스 (곡선 + 장애물)      ★ 라이다 조향
    #      6  교차로
    #      7  T 주차                      ★ 라이다 조향
    #      8  좌회전
    #      9  가속 구간
    #     10  평행 주차                   ★ 라이다 조향
    #     11  마지막 주행 (종점까지)
    #
    #   ⚠ 번호는 문자열이다. yaml 에서 따옴표를 빼면 int 로 잡혀
    #     STRING_ARRAY 와 타입이 어긋나 매니저가 죽는다.
    known_modes:
      - "0"    # 대기
      - "1"    # 출발 직선
      - "2"    # 경사로
      - "3"    # D 코스
      - "4"    # 교차로
      - "5"    # S 코스
      - "6"    # 교차로
      - "7"    # T 주차
      - "8"    # 좌회전
      - "9"    # 가속
      - "10"   # 평행 주차
      - "11"   # 마지막 주행

    # ---------- 옛 이름 → 번호 (0831) ----------
    #   GPS팀 route_follower 는 아직 이름을 발행한다.
    #   별칭이 없으면 그 이름이 known_modes 에 없어 거부되고,
    #   policy=keep 이라 **에러 없이 직전 모드가 그대로 유지된다.**
    #   0829 의 /vehicle_mode 사태와 완전히 같은 함정이라 미리 막는다.
    #
    #   🔴 이름으로는 구분이 안 되는 것들
    #     · CSV 의 NORMAL 은 1·4·6·8·11 중 어느 것인지 알 수 없다 → 1 로 보낸다
    #     · CSV 의 INTERSECTION 은 CSV 상 8번 자리(좌회전)에 있다 → 8 로 보낸다
    #     즉 **이름으로 받는 동안에는 4·6번 교차로를 구분할 수 없다.**
    #     구분이 이번 변경의 목적이므로 GPS팀이 번호 발행으로 바꿔야 완성된다.
    #     바꾸면 이 목록을 통째로 비울 것.
    mode_aliases:
      - "IDLE:0"
      - "NORMAL:1"            # ★ 몇 번째인지 모른다. 임시값
      - "SLOPE:2"
      - "D_COURSE:3"
      - "S_COURSE:5"
      - "T_PARK:7"
      - "INTERSECTION:8"      # ★ CSV 상 위치는 좌회전 자리
      - "ACCEL:9"
      - "PARALLEL_PARK:10"
      - "OUT:11"

    unknown_mode_policy: "keep"

    # ---------- 조향 권한 ----------
    #   기본은 카메라. 아래 번호에서만 다른 팀이 가져간다.
    #
    #   ⚠ 조향 권한이 없는 소스가 값을 보내면 **무시된다.**
    #     0830 에 라이다로 S자를 연습했는데 차가 직진만 한 이유가 이것이다
    #     (그때 5번 구간의 권한자가 카메라였다).
    #     이제 그 상황에서 매니저가 무엇을 고쳐야 하는지까지 로그로 찍는다.
    wheel_owner_default: "camera"
    # ==========================================================
    # 🔴 회피 게이트 (0831)
    # ==========================================================
    #   "5번 구간에서, /avoidance/active 가 true 일 때만
    #    라이다가 조향과 속도를 조절할 수 있다."
    #
    #   그 규칙을 **중재기가 강제한다.** 게이트가 닫혀 있으면 라이다의
    #   구동값·조향값을 아예 없는 것으로 취급한다.
    #
    #   ⚠ 급정거(/lidar_stop)는 게이트와 무관하게 항상 받는다.
    #     안전은 게이트보다 위다.
    #
    #   신호는 **라이다 회피 노드가 발행**한다 (중재기는 구독만).
    #   신호가 한 번도 안 오거나 timeout 을 넘기면 **막는다.**
    #   못 받는 상태에서 라이다가 차를 모는 것보다 안 움직이는 편이 낫다.
    #
    #   safety_state 에 사유가 그대로 나온다:
    #     AVOID_GATE(gate_false)      회피 노드가 false 를 보내는 중
    #     AVOID_GATE(gate_no_signal)  신호를 한 번도 못 받았다
    #     AVOID_GATE(gate_stale)      오다가 끊겼다
    #
    #   빈 목록으로 두면 게이트를 끈다 (아무것도 안 막는다).
    avoidance_gate_topic: "/avoidance/active"
    avoidance_gate_modes:
      - "5"      # S 코스 — 곡선 + 장애물 우회
    avoidance_gate_sources: ["lidar"]
    avoidance_gate_timeout_s: 1.0

    wheel_owner_overrides:
      - "5:lidar"      # S 코스    곡선 + 장애물 우회
      - "7:lidar"      # T 주차
      - "10:lidar"     # 평행 주차
      # 필요하면 주석을 풀 것 ------------------------------
      # - "3:lidar"    # D 코스도 라이다로 돌릴 때
    wheel_failsafe_mode: "center"

    # 급정거 (래치 아님)
    # ★ 0828: manual 추가.
    #   여기 없으면 매니저가 /manual_stop 을 구독조차 하지 않는다.
    #   drive_wasd.py 의 F(급정거) 키가 아무 일도 하지 않고 있었다.
    stop_sources: [lidar, camera, manual]
    stop_timeout_s: 0.5

    manual_override_enabled: true
    manual_source_name: "manual"

    initial_mode: "0"          # 0 = 대기 (출발 전). 0831 번호 방식
    publish_hz: 20.0
    drive_timeout_s: 0.5
    wheel_timeout_s: 0.5

    drive_validation_mode: "allowed_values"
    drive_allowed_values: [-1.0, 0.0, 1.0, 2.0, 3.0]
    drive_min: -1.0
    drive_max: 3.0
    wheel_min: -27
    wheel_max: 27

    # m/s → 단계 변환, Twist 변환용
    max_steer_deg: 27.0
    wheelbase_m: 0.73
    mps_deadband: 0.05

    # ★ 0829 변경: "/vehicle_mode" → "/drive_mode"
    #
    #   GPS팀 gps_route_follower 가 "/vehicle_mode" 를 **Int32(1~11)** 로
    #   이미 쓰고 있다. 우리는 String 을 기대하므로 이름은 같아도
    #   메시지가 한 개도 안 들어온다. 그런데 에러가 안 난다.
    #
    #   문자열 구간 이름은 그쪽이 "/drive_mode" (String) 로 따로 낸다.
    #     gps_route_follower_node.py:359  mode_pub = create_publisher(String, drive_mode_topic)
    #   그래서 우리가 봐야 할 토픽은 이쪽이다.
    mode_topic: "/drive_mode"
    estop_topic: "/estop_lock"

    # 내부 전용. 브릿지만 구독한다. 팀은 여기 발행하지 않는다.
    output_drive_topic: "/mcu/cmd_drive"
    output_wheel_topic: "/mcu/cmd_wheel"
    output_stop_topic: "/mcu/cmd_stop"

    status_mode_topic: "/mcu/current_mode"
    status_drive_source_topic: "/mcu/active_drive_source"
    status_wheel_source_topic: "/mcu/active_wheel_source"
    status_safety_topic: "/mcu/safety_state"

    # ★ 0829 변경: "/mcu/ready" → "/mcu/manager_ready"
    #   브릿지도 pub_topic_ready 로 "/mcu/ready" 를 발행하고 있었다.
    #   같은 이름 같은 타입(Bool)인데 뜻이 다르다.
    #     브릿지 /mcu/ready       = 아두이노와 통신이 살아있고 READY 상태인가
    #     매니저 /mcu/manager_ready = 중재기가 유효한 명령을 내보내고 있는가
    #   두 노드가 한 토픽에 번갈아 쏘면 구독자는 깜빡이는 값을 본다.
    #   에러는 안 난다. 그래서 못 잡고 있었다.
    status_ready_topic: "/mcu/manager_ready"

    # ========================================================
    # 팀별 입력 — 실제 팀에서 나온 이름으로 설정
    #
    #   drive_unit  : "stage"(0/1/2/3/-1) | "mps"(m/s → 단계 자동변환)
    #   wheel_type  : "int"(Int32 도) | "float"(Float32 도)
    #                 | "norm"(Float32 -1.0~+1.0)
    #   cmd_vel_topic: 값이 있으면 Twist 를 구독해 자전거모델로 자동 변환
    #                  (이 경우 drive/wheel 토픽은 무시됨)
    # ========================================================

    # ---- 라이다 ----
    lidar_drive_topic: "/lidar_drive"
    lidar_wheel_topic: "/lidar_wheel"
    lidar_stop_topic: "/lidar_stop"
    lidar_drive_unit: "stage"
    lidar_wheel_type: "int"
    # Nav2 를 그대로 쓰려면 여기에 Twist 토픽을 넣으면 자동 변환된다.
    # (넣으면 위 drive/wheel 토픽은 무시됨)
    lidar_cmd_vel_topic: ""

    # ---- 카메라 ----
    camera_drive_topic: "/camera_drive"
    camera_wheel_topic: "/camera_wheel"
    camera_stop_topic: "/camera_stop"
    camera_drive_unit: "stage"
    camera_wheel_type: "int"
    camera_cmd_vel_topic: ""

    # ---- GPS ----
    gps_drive_topic: "/gps_drive"
    gps_wheel_topic: "/gps_wheel"
    gps_stop_topic: "/gps_stop"
    gps_drive_unit: "stage"
    gps_wheel_type: "int"
    gps_cmd_vel_topic: ""

    # ---- 수동 (우리 테스트용) ----
    manual_drive_topic: "/manual_drive"
    manual_wheel_topic: "/manual_wheel"
    manual_stop_topic: "/manual_stop"
    manual_drive_unit: "stage"
    manual_wheel_type: "int"
    manual_cmd_vel_topic: ""
