# t870_frames.yaml — 센서 장착 위치 (static TF)
#
# ★ odom 과 헷갈리지 말 것
#     odom       = 차가 지금 어디까지 왔나 (계속 변함, MCU 가 계산)
#     static TF  = 센서가 차의 어디에 붙어 있나 (안 변함, 줄자로 재서 넣음)
#   Nav2 는 둘 다 필요하다. 이 파일은 뒤쪽이다.
#
# ==========================================================
#  좌표계 규약 (REP-103, ROS 표준)
#
#      x  앞이 +        y  왼쪽이 +        z  위가 +
#      roll  x축 회전    pitch  y축 회전(고개 숙이면 +)    yaw  z축 회전(좌회전 +)
#      단위: 미터, 라디안
#
#  ⚠ 조향 명령의 "+가 우측" 규약과 다르다. 그건 우리 팀 내부 규약이고
#    TF 는 ROS 표준을 따라야 다른 패키지(Nav2 등)와 맞는다.
# ==========================================================
#
#  기준점 base_link = 뒤축 중심, 지면 높이
#
#    측면에서 본 그림
#
#         카메라
#           ▼
#      ┌─────────────┐
#      │             │
#      └──○───────○──┘
#        뒤축      앞축
#         ▲        ↑
#      base_link   축거 0.73m
#      (지면)
#
#  → 뒤축 중심에서 앞으로 잰 거리가 x, 위로 잰 높이가 z
#
# ==========================================================
#  🔴 아래 값은 전부 추정치다. 반드시 실측해서 바꿀 것.
#     틀리면 라이다가 본 장애물 위치가 그만큼 통째로 어긋난다.
#     에러는 나지 않는다.
#
#  재는 법
#    1. 차를 평평한 곳에 세운다
#    2. 뒤축 중심(뒷바퀴 두 개를 잇는 선의 가운데)을 바닥에 표시한다
#    3. 그 점에서 각 센서까지 앞/옆/위 방향으로 각각 잰다
#    4. 앞이 +x, 왼쪽이 +y, 위가 +z
# ==========================================================

frames:
  # ---- 카메라 (RealSense D456) ----
  camera_link:
    parent: base_link
    x: 1.10          # 🔴 측정 필요 — 뒤축에서 앞으로
    y: 0.00          # 🔴 좌우 중앙이면 0
    z: 0.55          # 🔴 지면에서 높이
    roll: 0.0
    pitch: 0.0       # 🔴 아래로 기울였으면 + (예: 10도 = 0.175)
    yaw: 0.0

  # ---- 라이다 (RPLIDAR) ----
  laser:
    parent: base_link
    x: 1.05          # 🔴 측정 필요
    y: 0.00          # 🔴
    z: 0.50          # 🔴
    roll: 0.0
    pitch: 0.0
    yaw: 0.0         # 🔴 0도 방향이 차량 정면이 아니면 그 각도

  # ---- GPS 안테나 (u-blox F9P) ----
  gps_link:
    parent: base_link
    x: 0.20          # 🔴 측정 필요
    y: 0.00          # 🔴
    z: 0.60          # 🔴 안테나 중심 높이
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

  # ---- IMU (RealSense D456 내장) ----
  # 카메라 안에 있으므로 camera_link 기준으로 잡는다.
  # D456 의 IMU 오프셋은 데이터시트 값을 쓰면 된다.
  imu_link:
    parent: camera_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
