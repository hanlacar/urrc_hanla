course_mission_node:
  ros__parameters:
    ramp_pitch_deg: 15.0
    # Require a stable incline before starting the ramp maneuver.
    ramp_pitch_confirm_sec: 0.5
    ramp_delay_sec: 0.5
    ramp_slow_pitch_deg: 5.0
    # At 15 deg: align for 0.5 s, follow the camera path at stage 2 for 3 s,
    # then latch stage 1 until the ramp becomes level to resist rollback.
    ramp_slow_hold_sec: 3.0
    ramp_level_pitch_deg: 3.0
    # Stop as soon as the calibrated stop-line distance reaches 2 m.
    stop_line_trigger_distance_m: 2.0
    # Start this hold only after encoder feedback confirms an actual stop.
    minimum_stop_sec: 2.0
    actual_stop_speed_mps: 0.05
    # A line must remain absent this long before another detection is counted.
    stop_line_rearm_sec: 0.5
    # At the second ramp line within 2 m, remain stopped for this duration;
    # after it expires, continue camera path following at stage 2.
    ramp_post_stop_drive_sec: 3.0
    # Stop for one second before the stage-1 departure phase.
    ramp_second_line_stop_sec: 1.0
    # Require this absence before the next traffic20 is a new sign event.
    traffic20_rearm_sec: 0.5
    # The perception node already confirms each labeled signal for 3 seconds.
    green_confirm_sec: 0.0
    command_rate_hz: 20.0
    sensor_timeout_sec: 0.5
    # Compare successive paths over X=0.5..3.0 m. A median lateral shift of
    # 0.25 m or more is reported as a path jump to the external MCU computer.
    path_jump_threshold_m: 0.25
    path_jump_forward_min_m: 0.5
    path_jump_forward_max_m: 3.0
    # Spatial quality prevents a stable but zigzag/far-only path from being
    # reported as 100 percent accurate.
    path_required_forward_span_m: 1.5
    path_required_near_point_m: 1.0
    path_maximum_lateral_step_m: 0.15
