course_mission_node:
  ros__parameters:
    ramp_pitch_deg: 5.0
    ramp_delay_sec: 0.5
    ramp_slow_pitch_deg: 5.0
    # At 5 deg: align for 0.5 s, follow the camera path at stage 2 for 3 s,
    # then latch stage 1 until the ramp becomes level to resist rollback.
    ramp_slow_hold_sec: 3.0
    ramp_level_pitch_deg: 3.0
    # Stop as soon as the calibrated stop-line distance reaches 2 m.
    stop_line_trigger_distance_m: 2.0
    # Start this hold only after encoder feedback confirms an actual stop.
    minimum_stop_sec: 2.0
    actual_stop_speed_mps: 0.05
    # Release an intersection only after uninterrupted GREEN confirmation.
    green_confirm_sec: 2.0
    command_rate_hz: 20.0
    sensor_timeout_sec: 0.5
