course_mission_node:
  ros__parameters:
    waypoint_control: true
    input_guard_topic: "/mission/route_valid"
    # Stop reference is the fused route target, with braking distance compensation.
    waypoint_stop_tolerance_m: 0.25
    waypoint_deceleration_mps2: 0.5
    waypoint_command_latency_sec: 0.15
    # Legacy Bool adapter, unused when waypoint_control is true.
    ramp_dr_stop_topic: ""
    # Decision filter on complementary-filtered Pitch; tune with vehicle logs.
    ramp_filter_tau_sec: 0.25
    ramp_roughness_tau_sec: 0.3
    ramp_roughness_limit_deg: 1.0
    ramp_outlier_limit_deg: 45.0
    ramp_pitch_deg: 4.5
    # After GPS section 2 entry, travel 0.5 m, then confirm incline for 1 s.
    ramp_entry_distance_m: 0.5
    ramp_pitch_confirm_sec: 1.0
    ramp_delay_sec: 0.5
    ramp_slow_pitch_deg: 5.0
    # After ramp confirmation: align for 0.5 s, follow the camera path at stage 2 for 3 s,
    # then latch stage 1 until the ramp becomes level to resist rollback.
    ramp_slow_hold_sec: 3.0
    ramp_level_pitch_deg: 3.0
    # Legacy camera-line parameters, unused by waypoint stop/signal decisions.
    stop_line_trigger_distance_m: 2.0
    intersection_stop_wait_sec: 1.0
    # Legacy hold setting; waypoint ramp uses ramp_second_line_stop_sec below.
    minimum_stop_sec: 2.0
    actual_stop_speed_mps: 0.05
    # A line must remain absent this long before another detection is counted.
    stop_line_rearm_sec: 0.5
    # After the first ramp stop line, accept another detection as the second
    # line only after MCU odometry reports at least this much travel.
    # Legacy compatibility; unused for ramp DR arrival.
    ramp_stop_line_min_separation_m: 1.5
    # Waypoint mode: hold three seconds AFTER measured stop at the 1 m offset target.
    ramp_second_line_stop_sec: 3.0
    ramp_post_stop_drive_sec: 0.0
    # Require this absence before the next traffic20 is a new sign event.
    traffic20_rearm_sec: 0.5
    # A re-detected traffic20 must also be this far from the first one,
    # measured from the cumulative MCU odometry path length.
    traffic20_rearm_distance_m: 2.0
    odom_topic: "/mcu/odom"
    # Waypoint signals use a seven-frame majority in the perception node.
    green_confirm_sec: 0.0
    command_rate_hz: 20.0
    sensor_timeout_sec: 0.5
    # Compare successive paths over X=0.5..3.0 m. A median lateral shift of
    # 0.25 m or more is reported as a path jump to the external MCU computer.
    path_jump_threshold_m: 0.25
    path_jump_forward_min_m: 0.5
    path_jump_forward_max_m: 3.0
    # Spatial quality prevents a stable but zigzag/far-only path from being
    # reported as 100 percent accurate.
    path_required_forward_span_m: 1.5
    path_required_near_point_m: 1.0
    path_maximum_lateral_step_m: 0.15
