camera_yolo_inference_node:
  ros__parameters:
    segmentation_model_path: ""
    class_manifest_path: ""
    device: cuda:0
    input_width: 640
    input_height: 480
    inference_fps: 40.0
    detections_image_fps: 30.0
    confidence_threshold: 0.25
    mask_threshold: 0.50
    # Navigation masks use stricter class-specific confidence gates while
    # traffic lights and stop signs retain the detector-level 0.25 gate.
    road_confidence_threshold: 0.40
    lane_confidence_threshold: 0.60
    lane_minimum_component_area: 80
    lane_maximum_horizontal_ratio: 4.0
    lane_minimum_horizontal_width: 80
    # Production default: no fixed hood crop. Offline video launch overrides
    # this to 0.18 for the recorded vehicle-front obstruction.
    navigation_bottom_exclusion_ratio: 0.0
    # Measured D456 lens centre relative to rear-axle base_link.
    camera_x_m: 0.38
    camera_y_m: 0.0
    camera_z_m: 0.96
    camera_mount_roll_deg: 0.0
    camera_mount_pitch_deg: -5.0
    camera_mount_yaw_deg: 0.0
    max_image_age_sec: 0.40
    # TensorRT on the MX450 is normally near 40 ms but can exceed that during
    # scheduling jitter.  Reject genuinely stale work without invalidating the
    # entire perception chain on a single-frame overrun.
    max_inference_latency_ms: 100.0
    input_image_topic: /camera/image_raw
    input_camera_info_topic: /camera/camera_info
    stop_detected_topic: /perception/stop_detected
    stop_confidence_threshold: 0.25
    publish_diagnostics: true
    require_cuda: true
    use_sim_time: false
