mcu_bridge:
  ros__parameters:
    port: "/dev/ttyACM0"
    baud: 115200

    # Arduino firmware watchdog is 2 s; bridge refreshes propulsion at 10 Hz.
    send_hz: 10.0

    # Drive and wheel freshness are independent.
    drive_timeout_s: 0.5
    wheel_timeout_s: 0.5

    status_poll_hz: 5.0

    max_steer_deg: 27
    steer_limit_ms: 440
    steer_cmd_mode: "W"

    # Current choice: keep the last steering command if wheel input goes stale.
    # Change to "center" later if absolute steering recovery proves unreliable.
    wheel_timeout_policy: "hold_last"

    # STATUS fault != 0 is treated as a physical/firmware safety fault and latches E-stop.
    latch_on_firmware_fault: true
    reconnect_delay_s: 1.0

    # Existing odometry support. 0 disables speed/distance/odom output until calibrated.
    counts_per_meter: 1073.4
    wheelbase_m: 0.73
    encoder_signed: false
    odom_frame: "odom"
    base_frame: "base_link"
