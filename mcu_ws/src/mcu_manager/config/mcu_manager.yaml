mcu_manager:
  ros__parameters:
    # Sources. Add/remove names here, then define <source>_drive_topic and
    # <source>_wheel_topic below.
    source_names: [camera, lidar, gps, manual]

    # Format: MODE:DRIVE_SOURCE:WHEEL_SOURCE
    # "none" means no source / safe stop for that channel.
    mode_map:
      - "IDLE:none:none"
      - "NORMAL:camera:camera"
      - "INTERSECTION:gps:gps"
      - "T_PARK:lidar:lidar"
      - "PARALLEL_PARK:lidar:lidar"
      - "SLOPE:camera:camera"
      - "ACCELERATION:camera:camera"
      - "MANUAL:manual:manual"

    initial_mode: "IDLE"
    publish_hz: 20.0
    drive_timeout_s: 0.5
    wheel_timeout_s: 0.5
    gps_camera_wait_s: 2.0
    section_topic: "/mission/active_section"
    speed_topic: "/vehicle/speed_mps"
    speed_valid_topic: "/vehicle/speed_valid"
    speed_timeout_s: 0.5
    stop_speed_threshold_mps: 0.05
    stop_confirm_s: 0.2
    section_entry_hold_s: 2.0

    # If the selected wheel command is stale/invalid, stop propulsion too.
    stop_drive_on_wheel_fault: true

    # hold_last: keep last valid steering command during stop/fault
    # center: command 0 degrees during stop/fault
    wheel_failsafe_mode: "hold_last"

    # Arduino bridge-compatible defaults.
    drive_validation_mode: "allowed_values"  # allowed_values | range
    drive_allowed_values: [-1.0, 0.0, 1.0, 2.0, 3.0]
    drive_min: -1.0
    drive_max: 3.0
    wheel_min: -27
    wheel_max: 27

    # Central control topics.
    mode_topic: "/vehicle_mode"
    estop_topic: "/estop_lock"
    output_drive_topic: "/mcu_drive"
    output_wheel_topic: "/mcu_wheel"

    # Status topics.
    status_mode_topic: "/mcu/current_mode"
    status_drive_source_topic: "/mcu/active_drive_source"
    status_wheel_source_topic: "/mcu/active_wheel_source"
    status_safety_topic: "/mcu/safety_state"
    status_ready_topic: "/mcu/ready"

    # Temporary input names. Change only these when actual sensor topics are fixed.
    camera_drive_topic: "/camera_drive"
    camera_wheel_topic: "/camera_wheel"
    lidar_drive_topic: "/lidar_drive"
    lidar_wheel_topic: "/lidar_wheel"
    gps_drive_topic: "/gps_drive"
    gps_wheel_topic: "/gps_wheel"
    manual_drive_topic: "/manual_drive"
    manual_wheel_topic: "/manual_wheel"
